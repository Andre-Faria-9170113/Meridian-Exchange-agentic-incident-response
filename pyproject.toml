[project]
name = "meridian-incident-response"
version = "0.1.0"
description = "Agentic AI final project starter: Meridian incident response"
requires-python = ">=3.10"
dependencies = [
    "pydantic-ai-slim[openai]==2.54.0",
    "fastmcp-slim[server]==4.1.3",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "packaging>=24"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
